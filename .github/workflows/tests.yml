name: 回归与 Mock 端到端测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: 项目全量测试与基础 CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      TIMEZONE: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pin as calendar.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, same pin as calendar.yml
        with:
          python-version: '3.12.15'
      - name: 安装测试依赖与中文字体
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk jq curl openssl
      - name: 检查 Python 依赖一致性
        run: python -m pip check
      - name: 检查 Kindle Shell 语法
        run: |
          for script in kindle/*.sh; do
            sh -n "$script"
          done
      - name: 运行项目全部测试（包含 Mock 端到端）
        run: python -m unittest discover -s tests -v
