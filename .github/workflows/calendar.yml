name: Publish Kindle calendar

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      kodo_domain:
        description: 本次测试的下载 HTTPS 域名
        type: string
        default: https://tne40b3qh.hd-bkt.clouddn.com
      kodo_upload_host:
        description: 本次测试的上传入口（华东浙江）
        type: string
        default: https://upload.qiniup.com
      insecure_kodo_tls:
        description: 仅本次联调忽略 Kodo 下载证书校验
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: family-calendar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [qiniu, ubuntu-24.04]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      QINIU_BUCKET: ${{ vars.QINIU_BUCKET || 'kindle2calendar' }}
      KODO_DOMAIN: ${{ inputs.kodo_domain || vars.KODO_DOMAIN }}
      KODO_UPLOAD_HOST: ${{ inputs.kodo_upload_host || vars.KODO_UPLOAD_HOST }}
      KODO_INSECURE_TLS: ${{ inputs.insecure_kodo_tls && '1' || '0' }}
      SCREEN_ID: ${{ vars.SCREEN_ID || 'pw3' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
      WEATHER_CITY: ${{ vars.WEATHER_CITY }}
      WEATHER_LATITUDE: ${{ vars.WEATHER_LATITUDE }}
      WEATHER_LONGITUDE: ${{ vars.WEATHER_LONGITUDE }}
      FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - name: Validate configuration and set shared deadline
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          TECENT_CalDAV_UID: ${{ secrets.TECENT_CalDAV_UID }}
          TECENT_CalDAV_PASSWD: ${{ secrets.TECENT_CalDAV_PASSWD }}
        run: |
          missing=0
          for name in QINIU_AK QINIU_SK TECENT_CalDAV_UID TECENT_CalDAV_PASSWD KODO_DOMAIN KODO_UPLOAD_HOST; do
            if [ -z "${!name}" ]; then
              printf '::error::Missing Actions configuration: %s\n' "$name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          python3 -c 'import time; print("CALENDAR_DEADLINE_MONOTONIC=" + str(time.monotonic() + 540))' >> "$GITHUB_ENV"

      - name: Check out calendar source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-25
        with:
          persist-credentials: false
          sparse-checkout: |
            /*.py
            /requirements.txt
            /scripts/
            /storage/
            /assets/themes/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-25
        with:
          python-version: '3.12.15'

      - name: Install dependencies and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if [ ! -r "$FONT_PATH" ]; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update -qq
              apt-get install -y --no-install-recommends fonts-noto-cjk
            else
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            fi
          fi
          test -r "$FONT_PATH"

      - name: Check Kodo HTTPS before reading private calendar
        run: |
          python - <<'PY'
          import os
          from publication import StorageError
          from storage.kodo import HTTPTransport

          verify_tls = os.environ["KODO_INSECURE_TLS"] != "1"
          if not verify_tls:
              print("::warning::Kodo download TLS verification disabled for this test run")
          try:
              status, _, _ = HTTPTransport().request(
                  "GET", os.environ["KODO_DOMAIN"] + "/", timeout=30,
                  verify_tls=verify_tls,
              )
          except StorageError as error:
              print(f"::error::Kodo HTTPS check failed: {error.code}")
              raise SystemExit(1)
          print(f"Kodo HTTPS reachable; certificate verification: {verify_tls}; root HTTP status: {status}")
          PY

      - name: Generate calendar from Tencent CalDAV
        env:
          TECENT_CalDAV_ADDR: ${{ vars.TECENT_CalDAV_ADDR || 'dav.calendar.tencent.com' }}
          TECENT_CalDAV_UID: ${{ secrets.TECENT_CalDAV_UID }}
          TECENT_CalDAV_PASSWD: ${{ secrets.TECENT_CalDAV_PASSWD }}
          CALDAV_CALENDAR_NAME: ${{ vars.CALDAV_CALENDAR_NAME }}
        run: |
          umask 077
          for attempt in 1 2 3; do
            if python preview.py --caldav --screen-id "$SCREEN_ID" --output "$RUNNER_TEMP/calendar.png"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Publish calendar and verify readback
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_AK }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SK }}
          KODO_BUCKET: ${{ env.QINIU_BUCKET }}
        run: python -m scripts.publish_calendar --image "$RUNNER_TEMP/calendar.png"

      - name: Remove private temporary image
        if: always()
        run: rm -f -- "$RUNNER_TEMP/calendar.png"
