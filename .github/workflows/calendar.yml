name: 手动发布演示日历

on:
  workflow_dispatch:
    inputs:
      confirm_empty_calendar:
        description: 明确确认发布空日历到 demo- 屏幕，仅验证图片链路
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: family-calendar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [qiniu, ubuntu-24.04]
    timeout-minutes: 10
    env:
      SCREEN_ID: ${{ vars.SCREEN_ID }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
      FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - name: 确认演示目标并设置共享截止时间
        env:
          CONFIRM_EMPTY: ${{ inputs.confirm_empty_calendar }}
        run: |
          test "$CONFIRM_EMPTY" = true
          case "$SCREEN_ID" in demo-?*) ;; *) echo '演示仅允许 demo- 屏幕'; exit 2 ;; esac
          python3 -c 'import time; print("CALENDAR_DEADLINE_MONOTONIC=" + str(time.monotonic() + 540))' >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-25
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-25
        with:
          python-version: '3.12.15'
      - name: 安装依赖与中文字体
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: 生成明确的空日历演示图
        run: python preview.py --screen-id "$SCREEN_ID" --output artifacts/calendar.png
      - name: 发布并读回校验
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          KODO_BUCKET: ${{ vars.KODO_BUCKET }}
          KODO_DOMAIN: ${{ vars.KODO_DOMAIN }}
          KODO_UPLOAD_HOST: ${{ vars.KODO_UPLOAD_HOST }}
        run: python -m scripts.publish_calendar --image artifacts/calendar.png
